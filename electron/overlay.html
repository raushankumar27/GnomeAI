<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GnomeAI Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');
    
    :root {
      --bg-overlay: rgba(18, 19, 24, 0.96);
      --border-overlay: rgba(255, 255, 255, 0.12);
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --text: #ffffff;
      --text-dim: #a0aec0;
      --success: #34d399;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100vw;
      height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      height: 100%;
      background: var(--bg-overlay);
      border: 1px solid var(--border-overlay);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    .input-row {
      display: flex;
      align-items: center;
      height: 68px;
      padding: 0 20px;
      gap: 16px;
      flex-shrink: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .logo-container svg {
      width: 20px;
      height: 20px;
      color: white;
    }

    .input-wrapper {
      flex-grow: 1;
      position: relative;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
      font-family: 'Outfit', sans-serif;
    }

    input::placeholder {
      color: var(--text-dim);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn {
      background: var(--btn-bg);
      border: none;
      outline: none;
      color: var(--text);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
      transform: scale(1.05);
    }

    .btn.active {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Spinner loader */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin-right: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Collapsible response body */
    .response-box {
      display: none;
      flex-direction: column;
      border-top: 1px solid var(--border-overlay);
      background: rgba(0, 0, 0, 0.25);
      flex-grow: 1;
      overflow: hidden;
    }

    .response-scroll {
      flex-grow: 1;
      padding: 16px 20px;
      overflow-y: auto;
      color: var(--text);
      font-size: 14.5px;
      line-height: 1.6;
    }

    /* Code block styling */
    pre {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 12.5px;
      color: #34d399;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--border-overlay);
      flex-shrink: 0;
    }

    .action-btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      color: var(--text);
      background: var(--btn-bg);
      transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
    }

    .action-btn:hover {
      background: var(--btn-hover);
    }

    .action-btn.primary {
      background: var(--accent);
    }
    .action-btn.primary:hover {
      background: var(--accent-hover);
    }
    .action-btn.success {
      background: var(--success);
      color: #000;
    }
    .action-btn.success:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="input-row">
      <div class="logo-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      
      <div class="input-wrapper">
        <input type="text" id="prompt-input" placeholder="Instruct GnomeAI..." autofocus autocomplete="off">
      </div>

      <div class="controls">
        <div class="spinner" id="spinner"></div>
        <button class="btn" id="btn-mic" title="Voice Input (Push to Talk)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>
    </div>
    
    <div class="response-box" id="response-box">
      <div class="response-scroll" id="response-scroll"></div>
      <div class="actions-bar">
        <button class="action-btn success display-none" id="btn-run-code">▶ Run Code</button>
        <button class="action-btn primary" id="btn-expand-session">↗ Expand Chat</button>
        <button class="action-btn primary" id="btn-open-studio">🖥 Open Studio</button>
        <button class="action-btn" id="btn-close">Dismiss</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="./overlay.js"></script>
</body>
</html>
